<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Noor Spiritual Companion Banner">
  <defs>
    <linearGradient id="skyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030a16"/>
      <stop offset="55%" stop-color="#071a33"/>
      <stop offset="100%" stop-color="#0b2447"/>
    </linearGradient>
    <radialGradient id="archGlow" cx="50%" cy="54%" r="42%">
      <stop offset="0%" stop-color="#fde68a" stop-opacity="0.38"/>
      <stop offset="45%" stop-color="#f59e0b" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#071a33" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="centerLight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#fbbf24" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldArch" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="35%" stop-color="#fbbf24"/>
      <stop offset="75%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    <linearGradient id="glassSheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="55%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="320" rx="24" fill="url(#skyBg)"/>
  <rect x="1.5" y="1.5" width="1197" height="317" rx="22.5" fill="none" stroke="#93c5fd" stroke-opacity="0.22" stroke-width="1.5"/>
  <!-- Subtle geometric arch pattern -->
  <g fill="none" stroke="#38bdf8" stroke-opacity="0.09" stroke-width="1.2">
    <circle cx="960" cy="40" r="95"/>
    <circle cx="1050" cy="40" r="95"/>
    <circle cx="1140" cy="40" r="95"/>
    <circle cx="1005" cy="115" r="95"/>
    <circle cx="1095" cy="115" r="95"/>
  </g>
  <!-- Glass App Icon Badge matching Noor icon -->
  <g transform="translate(56, 58)">
    <rect x="0" y="0" width="204" height="204" rx="46" fill="#061730" stroke="#fde68a" stroke-opacity="0.45" stroke-width="2"/>
    <rect x="0" y="0" width="204" height="204" rx="46" fill="url(#archGlow)"/>
    <circle cx="102" cy="112" r="46" fill="url(#centerLight)"/>
    <!-- Pointed golden arch -->
    <path d="M 46 164 L 46 118 Q 52 72 102 44 Q 152 72 158 118 L 158 164 L 146 160 L 146 120 Q 141 82 102 58 Q 63 82 58 120 L 58 160 Z" fill="url(#goldArch)"/>
    <!-- Horizon curve -->
    <path d="M 24 176 Q 102 142 180 176 Q 102 154 24 176 Z" fill="url(#goldArch)"/>
    <!-- Luminous orb -->
    <circle cx="102" cy="112" r="11" fill="#fffbeb"/>
    <circle cx="102" cy="112" r="18" fill="#fbbf24" opacity="0.28"/>
    <!-- Glossy glass highlight -->
    <path d="M 18 54 Q 18 16 58 16 L 146 16 Q 186 16 186 54 Q 112 74 18 54 Z" fill="url(#glassSheen)"/>
    <rect x="1.5" y="1.5" width="201" height="201" rx="44.5" fill="none" stroke="#ffffff" stroke-opacity="0.24" stroke-width="1.5"/>
  </g>
  <!-- Title & Typography -->
  <text x="292" y="96" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" letter-spacing="3" fill="#fbbf24">OPEN-SOURCE ANDROID HYBRID ARCHITECTURE</text>
  <text x="290" y="152" font-family="Segoe UI, sans-serif" font-size="56" font-weight="800" fill="#ffffff" letter-spacing="1.5">NOOR</text>
  <rect x="476" y="114" width="76" height="32" rx="16" fill="#f59e0b" fill-opacity="0.18" stroke="#fbbf24" stroke-opacity="0.65"/>
  <text x="514" y="135" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#fde68a">v3.0</text>
  <text x="292" y="188" font-family="Segoe UI, sans-serif" font-size="21" font-weight="500" fill="#dbeafe">Offline-First Spiritual Companion &amp; Native Android 13/14 Core</text>
  <rect x="292" y="206" width="540" height="2.5" rx="1.25" fill="url(#goldAccent)" opacity="0.9"/>
  <!-- Chips -->
  <g font-family="Segoe UI, sans-serif" font-size="13.5" font-weight="600">
    <rect x="292" y="228" width="184" height="36" rx="18" fill="#ffffff" fill-opacity="0.07" stroke="#93c5fd" stroke-opacity="0.25"/>
    <text x="384" y="251" text-anchor="middle" fill="#eff6ff">100% Ad-Free &amp; Offline</text>
    <rect x="488" y="228" width="214" height="36" rx="18" fill="#f59e0b" fill-opacity="0.14" stroke="#fbbf24" stroke-opacity="0.45"/>
    <text x="595" y="251" text-anchor="middle" fill="#fde68a">Android 13/14 Exact Alarms</text>
    <rect x="714" y="228" width="212" height="36" rx="18" fill="#38bdf8" fill-opacity="0.14" stroke="#38bdf8" stroke-opacity="0.4"/>
    <text x="820" y="251" text-anchor="middle" fill="#bae6fd">React 18 + Capacitor + Java</text>
    <rect x="938" y="228" width="194" height="36" rx="18" fill="#10b981" fill-opacity="0.14" stroke="#34d399" stroke-opacity="0.4"/>
    <text x="1035" y="251" text-anchor="middle" fill="#a7f3d0">CI/CD &amp; E2E Verified</text>
  </g>
