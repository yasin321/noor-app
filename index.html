  <style>
    #noor-celestial-splash {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 28%, #0c3b33 0%, #051c24 52%, #020912 100%);
      color: #fef3c7;
      font-family: Vazirmatn, system-ui, -apple-system, sans-serif;
      transition: opacity 0.65s ease, transform 0.65s ease;
      overflow: hidden;
      direction: rtl;
    }
    #noor-celestial-splash.hide-splash {
      opacity: 0;
      transform: scale(1.04);
      pointer-events: none;
    }
    .noor-stars-bg {
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(1.5px 1.5px at 18% 22%, #fde68a 90%, transparent),
        radial-gradient(2px 2px at 82% 18%, #34d399 90%, transparent),
        radial-gradient(1.5px 1.5px at 28% 72%, #ffffff 85%, transparent),
        radial-gradient(2px 2px at 74% 66%, #fbd38d 90%, transparent),
        radial-gradient(1px 1px at 45% 14%, #a7f3d0 90%, transparent),
        radial-gradient(1.5px 1.5px at 64% 36%, #fef08a 90%, transparent),
        radial-gradient(1.5px 1.5px at 14% 52%, #6ee7b7 90%, transparent),
        radial-gradient(2px 2px at 88% 48%, #ffffff 85%, transparent);
      animation: noorTwinkle 4s ease-in-out infinite alternate;
      opacity: 0.85;
    }
    .noor-nebula-glow {
      position: absolute;
      width: 320px;
      height: 320px;
      border-radius: 9999px;
      background: radial-gradient(circle, rgba(16, 185, 129, 0.24) 0%, rgba(251, 191, 36, 0.12) 45%, transparent 72%);
      filter: blur(18px);
      animation: noorPulseGlow 3.2s ease-in-out infinite alternate;
    }
    .noor-mihrab-card {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 0 24px;
    }
    .noor-mihrab-svg {
      width: 148px;
      height: 148px;
      filter: drop-shadow(0 14px 32px rgba(245, 158, 11, 0.28));
      animation: noorFloat 3s ease-in-out infinite alternate;
    }
    @keyframes noorTwinkle {
      0% { opacity: 0.45; transform: scale(0.98); }
      100% { opacity: 0.95; transform: scale(1.02); }
    }
    @keyframes noorPulseGlow {
      0% { transform: scale(0.92); opacity: 0.65; }
      100% { transform: scale(1.08); opacity: 1; }
    }
    @keyframes noorFloat {
      0% { transform: translateY(4px); }
      100% { transform: translateY(-4px); }
    }
  </style>

    window.addEventListener('DOMContentLoaded', function () {

          setTimeout(function () { sp.remove(); }, 700);
        }
      }, 950);
    });
