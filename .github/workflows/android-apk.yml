name: Android debug APK and emulator smoke test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "fix/**", "review/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build web assets
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_NESHAN_API_KEY: "service.c2ba51761f214fe3a707e823b50b00c5"
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install and launch APK in Android emulator
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop com.noor.app
            adb shell am start -n com.noor.app/.MainActivity
            sleep 25
            test -n "$(adb shell pidof com.noor.app)" || { echo "Noor process is not running after launch"; exit 1; }
            adb logcat -d > /tmp/noor-logcat.txt
            adb exec-out screencap -p > /tmp/noor-emulator.png
            grep -E 'supabaseUrl is required|FATAL EXCEPTION.*com\.noor\.app|Process: com\.noor\.app.*died' /tmp/noor-logcat.txt && { echo "App startup/runtime error detected in emulator logs"; exit 1; } || true

      - name: Upload emulator smoke-test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: noor-emulator-smoke-test
          path: |
            /tmp/noor-emulator.png
            /tmp/noor-logcat.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: noor-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Prepare Official APK File Name
        if: success() && github.ref == 'refs/heads/main'
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Noor-v2.0.0-Android.apk

      - name: Publish Official GitHub Release & Tag (v2.0.0)
        if: success() && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0
          name: "🌿 نسخه ۲.۰.۰ اپلیکیشن نور (Noor Official Release)"
          body: |
            ### ✨ ویژگی‌های نسخه ۲.۰.۰ اپلیکیشن نور
            - **🕌 مسجدیاب و مسیریاب هوشمند نشان:** یافتن نزدیک‌ترین مساجد اطراف با GPS به همراه زمان پیاده، خودرو و اتوبوس.
            - **📖 مصحف کامل ۱۱۴ سوره قرآن کریم:** نمایش صفحه‌ای (مصحف)، ۵ آیه‌ای و تک‌آیه + کوک یادآور سوره بعد از اذان.
            - **🔊 کلکسیون مؤذنان ایران، ترکیه، مصر و حرمین:** امکان انتخاب پخش کامل یا ۱۰ ثانیه اول اذان.
            - **🎨 فونت‌های اصیل ایرانی:** وزیرمتن، نازنین، نستعلیق، پرستو، صمیم و نسخ قرآنی.
            - **📥 دانلود مستقیم:** فایل `Noor-v2.0.0-Android.apk` را از بخش Assets در پایین همین متن دانلود و نصب کنید.
          files: Noor-v2.0.0-Android.apk
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}