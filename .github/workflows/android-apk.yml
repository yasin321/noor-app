name: Android debug APK and emulator smoke test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "fix/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: bash ./gradlew assembleDebug --stacktrace

      - name: Install and launch APK in Android emulator
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          script: |
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop com.noor.app
            adb shell monkey -p com.noor.app 1
            sleep 25
            adb shell pidof com.noor.app
            adb logcat -d > /tmp/noor-logcat.txt
            adb exec-out screencap -p > /tmp/noor-emulator.png
            if grep -E 'supabaseUrl is required|FATAL EXCEPTION.*com\.noor\.app|Process: com\.noor\.app.*died' /tmp/noor-logcat.txt; then
              echo "App startup/runtime error detected in emulator logs"
              exit 1
            fi

      - name: Upload emulator smoke-test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: noor-emulator-smoke-test
          path: |
            /tmp/noor-emulator.png
            /tmp/noor-logcat.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: noor-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
