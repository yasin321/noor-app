name: Build Noor Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Configure Maven mirrors
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          roots = [Path("node_modules"), Path("android")]
          mirror = 'maven { url "https://maven.aliyun.com/repository/google" }'

          for root in roots:
              if not root.exists():
                  continue
              for file in root.rglob("build.gradle"):
                  text = file.read_text(encoding="utf-8-sig")
                  if "com.android.tools.build:gradle:8.13.0" not in text:
                      continue
                  if mirror in text:
                      continue
                  text = re.sub(
                      r"repositories\s*\{",
                      lambda m: m.group(0) + "\n        " + mirror,
                      text
                  )
                  file.write_text(text, encoding="utf-8")
                  print(f"Configured: {file}")
          PY

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Noor-App-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
