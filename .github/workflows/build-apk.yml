name: Build & Release Noor Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK & Publish Dynamic Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 10

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Dependencies
        run: npm install

      - name: TypeScript Strict Check & Unit Tests
        run: |
          npm run typecheck
          npm test

      - name: Download Full Quran Surahs for Post-Adhan (Waqiah, Mulk, Rahman, Yasin)
        run: |
          curl -L -s --connect-timeout 10 --max-time 45 "https://server8.mp3quran.net/afs/056.mp3" -o public/adhans/post_waqiah.mp3 || true
          curl -L -s --connect-timeout 10 --max-time 45 "https://server8.mp3quran.net/afs/067.mp3" -o public/adhans/post_mulk.mp3 || true
          curl -L -s --connect-timeout 10 --max-time 45 "https://server8.mp3quran.net/afs/055.mp3" -o public/adhans/post_rahman.mp3 || true
          curl -L -s --connect-timeout 10 --max-time 45 "https://server8.mp3quran.net/afs/036.mp3" -o public/adhans/post_yasin.mp3 || true
          curl -L -s --connect-timeout 10 --max-time 45 "https://server8.mp3quran.net/afs/051.mp3" -o public/adhans/post_dhariyat.mp3 || true
          curl -L -s --connect-timeout 10 --max-time 45 -A "Mozilla/5.0" "https://irsv.upmusics.com/Tracks/Songs/MohammadReza%20Shajryan%20%E2%80%93%20Rabbana128%20(UpMusic).mp3" -o public/adhans/rabbana.mp3 || true
          curl -L -s --connect-timeout 10 --max-time 45 -A "Mozilla/5.0" "https://irsv.upmusics.com/singletracks/2025/12/Doaye%20Nadali%20-%20Ali%20Fani%20UpMusics.mp3" -o public/adhans/nadali_alifani.mp3 || true
          ls -lh public/adhans/post_*.mp3

      - name: Compress Bundled Speech Audio to 32kbps Mono (Reduce APK Size ~60MB)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          for f in public/adhans/*.mp3; do
            [ -f "$f" ] || continue
            size=$(stat -c%s "$f")
            if [ "$size" -gt 400000 ]; then
              ffmpeg -y -i "$f" -ac 1 -ar 22050 -b:a 32k "${f}.tmp.mp3" -loglevel error && mv "${f}.tmp.mp3" "$f"
            fi
          done
          du -sh public/adhans

      - name: Build Production Web Bundle
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap copy android && npx cap sync android

      - name: Inject Dynamic Version into Gradle & Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare Dynamic Version & Changelog
        id: meta
        run: |
          VERSION_TAG="v3.0.${{ github.run_number }}"
          echo "version_tag=$VERSION_TAG" >> $GITHUB_OUTPUT
          RECENT_COMMITS=$(git log -n 5 --pretty=format:"- %s (`%h`)" || echo "- بهبود عملکرد و رابط کاربری")
          EOF_MARKER="EOF_$$"
          echo "changelog<<$EOF_MARKER" >> $GITHUB_OUTPUT
          echo "$RECENT_COMMITS" >> $GITHUB_OUTPUT
          echo "$EOF_MARKER" >> $GITHUB_OUTPUT
          cp android/app/build/outputs/apk/debug/app-debug.apk "Noor-Companion-$VERSION_TAG.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Noor-Companion-${{ steps.meta.outputs.version_tag }}
          path: Noor-Companion-${{ steps.meta.outputs.version_tag }}.apk

      - name: Publish Official GitHub Release (Dynamic Version)
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ steps.meta.outputs.version_tag }}
          name: "🕌 نسخه ${{ steps.meta.outputs.version_tag }} اپلیکیشن همراه معنوی نور (Noor Official Release)"
          body: |
            ## ✨ انتشار رسمی نسخه `${{ steps.meta.outputs.version_tag }}` اپلیکیشن همراه معنوی نور
            **طراحی، معماری و توسعه توسط: یاسین (Yasin)**

            ### 🛠️ آخرین تغییرات و ارتقاهای این بیلد (Recent Commits)
            ${{ steps.meta.outputs.changelog }}

            ---
            ### �� قابلیت‌های کلیدی این نسخه (v3.0 Architecture)
            - 🎨 **رابط کاربری فیگما ۲۰۲۶:** افق پویا و تصویری شهر و حرم، قوس هلالی بزرگ اذان (Celestial Horizon Arc) و داک شیشه‌ای ۴ آیکونی.
            - 🧭 **قبله‌نمای عمودی هوشمند (AI / AR Mode):** بدون نیاز به افقی کردن گوشی، مجهز به فیلتر ضدلرزش EMA، دوربین واقعیت افزوده و قفل سه‌بعدی کعبه.
            - 🔔 **موتور آلارم سطح کرنل (`setAlarmClock`):** پخش خودکار تواشیح قبل اذان (ناد علی، اسماء الحسنی، عبدالباسط)، اذان‌های ماندگار و تلاوت کامل سوره پس از نماز با تنظیم سرعت (`0.85x` تا `2.0x`) و پایداری پس از ریستارت گوشی.
            - 🗺️ **رادار مسجدیاب ۵ موتوره:** ترکیب Fused GPS، نقشه نشان، OpenStreetMap Nominatim/Overpass و نقشه زنده تعاملی.
            - 📊 **داشبورد تحلیلی Power BI & VIP:** ماتریس حرارتی سالانه (Activity Heatmap)، نمودار موجی ماهانه، دفترچه شمارش معکوس قضا و تایمر خلوت خشوع.
          files: Noor-Companion-${{ steps.meta.outputs.version_tag }}.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
