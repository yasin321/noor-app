name: Build Noor Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, review/fix-notification-and-startup]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Build web app
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Configure Maven mirrors
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          roots = [Path("node_modules"), Path("android")]
          mirror = 'maven { url "https://maven.aliyun.com/repository/google" }'

          for root in roots:
              if not root.exists():
                  continue
              for file in root.rglob("build.gradle"):
                  text = file.read_text(encoding="utf-8-sig")
                  if "com.android.tools.build:gradle:8.13.0" not in text:
                      continue
                  if mirror in text:
                      continue
                  text = re.sub(
                      r"repositories\s*\{",
                      lambda m: m.group(0) + "\n        " + mirror,
                      text
                  )
                  file.write_text(text, encoding="utf-8")
                  print(f"Configured: {file}")
          PY

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Noor-App-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install and launch APK in Android emulator
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            adb wait-for-device
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb shell pm grant com.noor.app android.permission.POST_NOTIFICATIONS || true
            adb shell am force-stop com.noor.app
            adb shell am start -W -n com.noor.app/.MainActivity
            sleep 15
            test -n "$(adb shell pidof com.noor.app)" || { echo "Noor process is not running after launch"; exit 1; }
            adb logcat -d > /tmp/noor-logcat.txt || true
            adb exec-out screencap -p > /tmp/noor-emulator.png || true
            python3 -c 'import pathlib,re,sys; log=pathlib.Path("/tmp/noor-logcat.txt").read_text(errors="replace"); pattern=r"supabaseUrl is required|Invalid supabaseUrl|FATAL EXCEPTION|Process: com\.noor\.app.*died"; found=re.search(pattern,log); print("App startup/runtime error detected in emulator logs: "+found.group(0) if found else "No known fatal startup errors found"); sys.exit(1 if found else 0)'

      - name: Upload emulator smoke-test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: noor-emulator-smoke-test
          path: |
            /tmp/noor-emulator.png
            /tmp/noor-logcat.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Prepare Official APK File Name
        if: success() && github.ref == 'refs/heads/main'
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Noor-v2.0.0-Android.apk

      - name: Publish Official GitHub Release & Tag (v2.0.0)
        if: success() && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0
          name: "🌿 نسخه ۲.۰.۰ اپلیکیشن نور (Noor Official Release)"
          body: |
            ### ✨ ویژگی‌های نسخه ۲.۰.۰ اپلیکیشن نور
            - **🕌 مسجدیاب و مسیریاب هوشمند نشان:** یافتن نزدیک‌ترین مساجد اطراف با GPS به همراه زمان پیاده، خودرو و اتوبوس.
            - **📖 مصحف کامل ۱۱۴ سوره قرآن کریم:** نمایش صفحه‌ای (مصحف)، ۵ آیه‌ای و تک‌آیه + کوک یادآور سوره بعد از اذان.
            - **🔊 کلکسیون مؤذنان ایران، ترکیه، مصر و حرمین:** امکان انتخاب پخش کامل یا ۱۰ ثانیه اول اذان + تواشیح پیش از اذان.
            - **🎨 فونت‌های اصیل ایرانی:** وزیرمتن، نازنین، نستعلیق، پرستو، صمیم و نسخ قرآنی.
          files: Noor-v2.0.0-Android.apk
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
