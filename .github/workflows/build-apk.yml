
name: Build Noor Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, review/fix-notification-and-startup]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Build web app
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Configure Maven mirrors
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          roots = [Path("node_modules"), Path("android")]
          mirror = 'maven { url "https://maven.aliyun.com/repository/google" }'

          for root in roots:
              if not root.exists():
                  continue
              for file in root.rglob("build.gradle"):
                  text = file.read_text(encoding="utf-8-sig")
                  if "com.android.tools.build:gradle:8.13.0" not in text:
                      continue
                  if mirror in text:
                      continue
                  text = re.sub(
                      r"repositories\s*\{",
                      lambda m: m.group(0) + "\n        " + mirror,
                      text
                  )
                  file.write_text(text, encoding="utf-8")
                  print(f"Configured: {file}")
          PY

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install and launch APK in Android emulator
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop com.noor.app
            adb shell monkey -p com.noor.app 1
            sleep 25
            test -n "$(adb shell pidof com.noor.app)" || { echo "Noor process is not running after launch"; exit 1; }
            adb logcat -d > /tmp/noor-logcat.txt
            adb exec-out screencap -p > /tmp/noor-emulator.png
            if grep -Eq 'supabaseUrl is required|Invalid supabaseUrl|FATAL EXCEPTION|Process: com.noor.app.*died' /tmp/noor-logcat.txt; then
              echo "App startup/runtime error detected in emulator logs"
              exit 1
            fi

      - name: Upload emulator smoke-test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: noor-emulator-smoke-test
          path: |
            /tmp/noor-emulator.png
            /tmp/noor-logcat.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Noor-App-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
